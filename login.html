<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistem Pengiriman</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
    <main class="login-shell">
        <section class="login-brand">
            <img src="logo.png" alt="Logo Website">
            <p class="eyebrow">SISTEM INFORMASI PENGIRIMAN</p>
            <h1>Kelola pengiriman dengan lebih terarah.</h1>
            <p>Masuk menggunakan akun sesuai peran untuk melanjutkan ke halaman yang tersedia.</p>
        </section>
        <section class="login-card">
            <h2>Selamat datang</h2>
            <p class="login-subtitle">Masuk ke akun Anda untuk mengakses sistem.</p>
            <div class="login-error" data-error hidden></div>
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" required autocomplete="username" placeholder="Masukkan username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required autocomplete="current-password" placeholder="Masukkan password">
                </div>
                <button class="submit-button login-button" type="submit">Masuk ke sistem</button>
            </form>
        </section>
    </main>
    <script type="module">
        import { supabase, getCurrentProfile, getDefaultPage, showError } from "./supabase-client.js";

        try {
            const { data, error } = await supabase.auth.getSession();
            if (error) {
                throw error;
            }
            if (data.session) {
                const profile = await getCurrentProfile();
                if (profile) window.location.replace(getDefaultPage(profile.role));
            }
        } catch (error) {
            showError("Konfigurasi Supabase belum tersedia atau tidak dapat dihubungi.");
        }

        document.getElementById("login-form").addEventListener("submit", async function (event) {
            event.preventDefault();
            const button = event.submitter;
            button.disabled = true;
            button.textContent = "Memproses...";
            try {
                const username = document.getElementById("username").value.trim().toLowerCase();
                const { data: authEmail, error: profileError } = await supabase
                    .rpc("resolve_username_login", { login_username: username });
                if (profileError || !authEmail) {
                    throw new Error("Username atau password tidak valid.");
                }
                const { error } = await supabase.auth.signInWithPassword({
                    email: authEmail,
                    password: document.getElementById("password").value
                });
                if (error) throw error;
                const profile = await getCurrentProfile();
                window.location.replace(getDefaultPage(profile.role));
            } catch (error) {
                showError(error.message || "Email atau password tidak valid.");
                button.disabled = false;
                button.textContent = "Masuk ke sistem";
            }
        });
    </script>
</body>
</html>
